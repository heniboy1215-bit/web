<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Design Workshop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Header -->
  <header class="bg-dark text-white py-5">
    <div class="container">
      <span class="badge text-bg-warning mb-2">Free workshop</span>
      <h1 class="display-5 fw-bold mb-2">Web Design Workshop</h1>
      <p class="fs-5 mb-0">Build your first responsive webpage with HTML and Bootstrap.</p>
    </div>
  </header>

  <!-- Main -->
  <main class="bg-light py-5">
    <div class="container">
      <div class="row g-4">

        <!-- Workshop details -->
        <div class="col-md-5">
          <div class="card shadow-sm">
            <div class="card-body p-3">
              <h2 class="card-title fs-5 mb-3">Workshop details</h2>

              <div class="mb-2">
                <div class="fw-bold">Day</div>
                <div>Saturday</div>
              </div>
              <div class="mb-2">
                <div class="fw-bold">Location</div>
                <div>School computer lab</div>
              </div>
              <div>
                <div class="fw-bold">What to bring</div>
                <div>A laptop and charger</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Registration form -->
        <div class="col-md-7">
          <div class="card shadow-sm">
            <div class="card-body p-3">
              <h2 class="card-title fs-5 mb-3">Register for a session</h2>

              <form>
                <div class="mb-3">
                  <label for="fullName" class="form-label mb-1">Full name</label>
                  <input type="text" class="form-control" id="fullName">
                </div>

                <div class="mb-3">
                  <label for="email" class="form-label mb-1">Email address</label>
                  <input type="email" class="form-control" id="email">
                </div>

                <fieldset class="mb-3">
                  <legend class="fs-6 fw-bold mb-1">Choose a session</legend>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="session" id="morning">
                    <label class="form-check-label" for="morning">Morning · 9:00–11:00 AM</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="session" id="afternoon">
                    <label class="form-check-label" for="afternoon">Afternoon · 2:00–4:00 PM</label>
                  </div>
                </fieldset>

                <button type="submit" class="btn btn-primary px-3">Register</button>
                <p class="form-text small mt-3 mb-0">Practice form. Entries are discarded.</p>
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
